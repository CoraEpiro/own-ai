<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>AI Studio - Custom Instructions</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Inter:wght@300;400;500;600&amp;family=Sora:wght@600;700;800&amp;family=JetBrains+Mono:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        body {
            font-family: 'Inter', sans-serif;
            background-color: #131313;
        }
        .headline-font { font-family: 'Sora', sans-serif; }
        .mono-font { font-family: 'JetBrains Mono', monospace; }
        .glass-panel {
            background: rgba(53, 53, 52, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
        }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "secondary-container": "#571bc1",
                      "tertiary-fixed-dim": "#fbabff",
                      "on-tertiary-container": "#4d0059",
                      "on-primary-fixed": "#07006c",
                      "on-primary": "#1000a9",
                      "secondary-fixed": "#e9ddff",
                      "outline": "#908fa0",
                      "on-surface-variant": "#c7c4d7",
                      "surface-container": "#201f1f",
                      "on-tertiary": "#580065",
                      "primary-fixed": "#e1e0ff",
                      "surface-dim": "#131313",
                      "primary-container": "#8083ff",
                      "surface-tint": "#c0c1ff",
                      "on-tertiary-fixed": "#36003e",
                      "surface-container-highest": "#353534",
                      "on-error": "#690005",
                      "on-background": "#e5e2e1",
                      "on-primary-fixed-variant": "#2f2ebe",
                      "outline-variant": "#464554",
                      "surface-variant": "#353534",
                      "on-secondary-container": "#c4abff",
                      "on-secondary": "#3c0091",
                      "inverse-primary": "#494bd6",
                      "error-container": "#93000a",
                      "on-error-container": "#ffdad6",
                      "surface-container-lowest": "#0e0e0e",
                      "on-tertiary-fixed-variant": "#7c008e",
                      "tertiary-container": "#e14ef6",
                      "tertiary-fixed": "#ffd6fd",
                      "background": "#131313",
                      "tertiary": "#fbabff",
                      "on-surface": "#e5e2e1",
                      "secondary": "#d0bcff",
                      "primary-fixed-dim": "#c0c1ff",
                      "surface-container-low": "#1c1b1b",
                      "surface-container-high": "#2a2a2a",
                      "on-secondary-fixed": "#23005c",
                      "inverse-on-surface": "#313030",
                      "surface-bright": "#3a3939",
                      "secondary-fixed-dim": "#d0bcff",
                      "inverse-surface": "#e5e2e1",
                      "on-primary-container": "#0d0096",
                      "primary": "#c0c1ff",
                      "on-secondary-fixed-variant": "#5516be",
                      "surface": "#131313",
                      "error": "#ffb4ab"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "fontFamily": {
                      "headline": ["Plus Jakarta Sans"],
                      "body": ["Inter"],
                      "label": ["Inter"]
              }
            },
          }
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface flex flex-col min-h-screen">
<!-- Header Section -->
<header class="sticky top-0 z-50 bg-zinc-950/40 backdrop-blur-md px-6 py-5 flex items-center justify-between">
<div class="flex items-center gap-3">
<span class="material-symbols-outlined text-transparent bg-clip-text bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 font-bold" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<h1 class="text-xl font-bold tracking-tight headline-font bg-gradient-to-br from-indigo-500 via-violet-500 to-fuchsia-500 bg-clip-text text-transparent">AI Studio</h1>
</div>
<button class="w-10 h-10 rounded-full flex items-center justify-center bg-surface-container-high">
<span class="material-symbols-outlined text-on-surface-variant" data-icon="account_circle">account_circle</span>
</button>
</header>
<!-- Main Content -->
<main class="flex-1 overflow-y-auto px-6 pb-32">
<!-- Tab Navigation (Mobile Shell Component Logic Applied) -->
<div class="mt-4 flex overflow-x-auto no-scrollbar gap-6 items-center border-b border-white/5">
<button class="flex-none pb-3 font-semibold text-indigo-400 border-b-2 border-indigo-500 transition-all">Instructions</button>
<button class="flex-none pb-3 font-medium text-zinc-500 hover:text-zinc-300 transition-all">Memory</button>
<button class="flex-none pb-3 font-medium text-zinc-500 hover:text-zinc-300 transition-all">Knowledge Buckets</button>
<button class="flex-none pb-3 font-medium text-zinc-500 hover:text-zinc-300 transition-all">Voice Settings</button>
</div>
<section class="mt-8">
<div class="flex flex-col gap-2 mb-6">
<h2 class="text-3xl headline-font font-bold tracking-tight text-on-surface">Custom Instructions</h2>
<p class="text-on-surface-variant text-sm leading-relaxed">Define how the AI should behave and respond across all interactions.</p>
</div>
<!-- Quick Presets -->
<div class="mb-8">
<label class="block text-xs font-semibold uppercase tracking-widest text-zinc-500 mb-4">Quick Presets</label>
<div class="flex overflow-x-auto no-scrollbar gap-3 -mx-6 px-6">
<button class="flex-none px-4 py-3 rounded-xl bg-surface-container border border-white/5 hover:bg-surface-container-high transition-colors text-sm font-medium">
                        Creative Writer
                    </button>
<button class="flex-none px-4 py-3 rounded-xl bg-surface-container border border-white/5 hover:bg-surface-container-high transition-colors text-sm font-medium">
                        Code Architect
                    </button>
<button class="flex-none px-4 py-3 rounded-xl bg-surface-container border border-white/5 hover:bg-surface-container-high transition-colors text-sm font-medium">
                        Concise Assistant
                    </button>
<button class="flex-none px-4 py-3 rounded-xl bg-surface-container border border-white/5 hover:bg-surface-container-high transition-colors text-sm font-medium">
                        Academic Tutor
                    </button>
</div>
</div>
<!-- Editor Section -->
<div class="relative flex flex-col gap-4">
<div class="glass-panel rounded-2xl p-4 border border-white/5 shadow-2xl">
<textarea class="w-full bg-transparent border-none focus:ring-0 text-on-surface placeholder:text-zinc-600 text-[15px] leading-relaxed resize-none h-64 font-body" placeholder="I want the AI to always use a professional tone, provide source citations, and focus on technical accuracy..."></textarea>
<div class="mt-4 flex flex-col gap-3">
<div class="flex items-center justify-between">
<span class="mono-font text-[10px] text-zinc-500 uppercase tracking-widest">Instruction Capacity</span>
<span class="mono-font text-[10px] text-indigo-400 font-medium">1,240 / 5,000</span>
</div>
<div class="w-full h-1 bg-zinc-800 rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-indigo-500 via-violet-500 to-fuchsia-500 w-[24.8%]"></div>
</div>
</div>
</div>
<!-- Meta Info Cards -->
<div class="grid grid-cols-2 gap-3">
<div class="p-4 bg-surface-container-low rounded-xl border border-white/5">
<span class="material-symbols-outlined text-indigo-400 text-lg block mb-2" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<h3 class="text-xs font-bold text-on-surface">Private</h3>
<p class="text-[10px] text-on-surface-variant">Encrypted at rest</p>
</div>
<div class="p-4 bg-surface-container-low rounded-xl border border-white/5">
<span class="material-symbols-outlined text-fuchsia-400 text-lg block mb-2" data-icon="bolt" style="font-variation-settings: 'FILL' 1;">bolt</span>
<h3 class="text-xs font-bold text-on-surface">Global</h3>
<p class="text-[10px] text-on-surface-variant">All active models</p>
</div>
</div>
</div>
</section>
</main>
<!-- Bottom Action & Navigation Shell -->
<div class="fixed bottom-0 left-0 right-0 z-50">
<!-- Floating CTA -->
<div class="px-6 pb-4">
<button class="w-full h-14 rounded-2xl bg-gradient-to-r from-indigo-600 to-violet-600 text-white font-bold text-sm tracking-wide shadow-lg shadow-indigo-900/20 active:scale-[0.98] transition-transform">
                Save Instructions
            </button>
</div>
<!-- Mobile Bottom Nav -->
<nav class="bg-zinc-950/80 backdrop-blur-xl flex justify-around items-center h-20 px-4">
<a class="flex flex-col items-center gap-1 group text-zinc-500" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="home">home</span>
<span class="text-[10px] font-medium">Home</span>
</a>
<a class="flex flex-col items-center gap-1 group text-zinc-500" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="search">search</span>
<span class="text-[10px] font-medium">Search</span>
</a>
<!-- Center FAB -->
<a class="flex items-center justify-center -mt-10 bg-indigo-500 w-14 h-14 rounded-full shadow-[0_8px_30px_rgb(99,102,241,0.4)] text-white" href="#">
<span class="material-symbols-outlined text-3xl" data-icon="add" style="font-variation-settings: 'wght' 500;">add</span>
</a>
<!-- Active Tab Mapping Logic -->
<a class="flex flex-col items-center gap-1 group text-indigo-400" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="psychology" style="font-variation-settings: 'FILL' 1;">psychology</span>
<span class="text-[10px] font-semibold">Studio</span>
</a>
<a class="flex flex-col items-center gap-1 group text-zinc-500" href="#">
<span class="material-symbols-outlined text-2xl" data-icon="person">person</span>
<span class="text-[10px] font-medium">Profile</span>
</a>
</nav>
</div>
</body></html>
