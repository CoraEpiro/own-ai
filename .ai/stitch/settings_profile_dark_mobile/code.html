<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col">

</button>
<h1 class="text-xl font-bold text-indigo-400">Settings</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-zinc-400 hover:text-zinc-100 transition-colors">help</span>

</button>
</div>
<div>

<div class="glass-card p-1 rounded-xl border border-white/5">
<div class="bg-surface-container-highest/30 p-4 rounded-lg flex flex-col space-y-1">
<span class="text-xs text-zinc-500 font-label">Display Name</span>
<input class="bg-transparent border-none p-0 text-on-surface font-semibold focus:ring-0 w-full" type="text" value="The Ethereal Intelligence"/>
</div>
</div>
<div class="glass-card p-1 rounded-xl border border-white/5">
<div class="bg-surface-container-highest/30 p-4 rounded-lg flex flex-col space-y-1">
<span class="text-xs text-zinc-500 font-label">Email Address</span>
<input class="bg-transparent border-none p-0 text-on-surface font-semibold focus:ring-0 w-full" type="email" value="ethereal@intelligence.ai"/>
</div>
</div>
</div>

<div class="space-y-4">
<label class="block text-xs font-bold uppercase tracking-widest text-indigo-400/80 px-1">Security</label>

<div class="bg-surface-container-highest/30 p-4 rounded-lg flex items-center justify-between">
<div class="flex flex-col space-y-1">

</div>
</div>
</div>

<label class="block text-xs font-bold uppercase tracking-widest text-indigo-400/80 px-1">System Metadata</label>
<div class="glass-card p-4 rounded-xl border border-white/5 flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="p-2 bg-indigo-500/10 rounded-lg">
<span class="material-symbols-outlined text-indigo-400">memory</span>
</div>
<span class="font-label text-sm">Default Model ID</span>
</div>
<code class="font-mono text-[10px] text-fuchsia-400 bg-fuchsia-400/10 px-2 py-1 rounded">ETH-V2-PRO</code>
</div>
</div>
<!-- Action Buttons -->
<div class="pt-6 flex flex-col gap-3">
<button class="brand-gradient-bg py-4 rounded-xl font-bold text-white shadow-xl shadow-indigo-500/20 active:scale-95 transition-transform">
                    Save Changes
                </button>
<button class="py-4 rounded-xl font-semibold text-zinc-500 hover:text-on-surface transition-colors">
                    Reset to Defaults

</div>
</section>

<div class="h-24"></div>

<span class="text-[10px] font-medium font-plus-jakarta text-indigo-400">Profile</span>

</div>
<div class="text-zinc-500 hover:text-zinc-300 px-4 py-3 flex items-center gap-3 transition-colors">

</div>
