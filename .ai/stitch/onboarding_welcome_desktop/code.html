<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      display: inline-block;
      line-height: 1;
      text-transform: none;
      letter-spacing: normal;
      word-wrap: normal;
      white-space: nowrap;
      direction: ltr;
    }
    .brand-gradient {
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #D946EF 100%);
    }
    .brand-text-gradient {
      background: linear-gradient(135deg, #6366F1 0%, #8B5CF6 50%, #D946EF 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .glass-effect {
      background: rgba(53, 53, 52, 0.4);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    @keyframes gradient-shift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .animated-bg {
      background-size: 200% 200%;
      animation: gradient-shift 15s ease infinite;
    }
  </style>

<body class="bg-background text-on-background font-body selection:bg-primary/30 min-h-screen flex flex-col overflow-hidden">
<!-- Suppression Check: Navigation hidden for Linear Onboarding Flow -->
<main class="relative flex-grow flex flex-col items-center justify-center animated-bg brand-gradient p-6">
<!-- Ambient Overlay for Tonal Depth -->
<div class="absolute inset-0 bg-surface-container-lowest/40 pointer-events-none"></div>
<!-- Step Indicator (Floating Top) -->
<div class="absolute top-12 left-0 w-full flex justify-center px-8">
<div class="flex items-center gap-3 glass-effect px-5 py-2.5 rounded-full shadow-2xl">
<div class="w-2.5 h-2.5 rounded-full brand-gradient shadow-[0_0_12px_rgba(99,102,241,0.6)]"></div>
<div class="w-2 h-2 rounded-full bg-on-surface/20"></div>
<div class="w-2 h-2 rounded-full bg-on-surface/20"></div>
<div class="w-2 h-2 rounded-full bg-on-surface/20"></div>
<span class="ml-2 font-mono text-[10px] tracking-widest text-on-surface/60 uppercase">Step 1 of 4</span>
</div>
</div>

<div class="relative z-10 flex flex-col items-center max-w-2xl w-full text-center">

<div class="mb-12 group cursor-default">
<div class="relative">
<div class="absolute inset-0 blur-3xl opacity-30 brand-gradient rounded-full scale-150"></div>
<div class="relative bg-surface-container-lowest/80 p-8 rounded-[2rem] border border-white/10 shadow-2xl backdrop-blur-md">
<span class="material-symbols-outlined text-7xl brand-text-gradient" style="font-variation-settings: 'FILL' 1;">rocket_launch</span>
</div>
</div>
<div class="mt-8">
<h1 class="font-headline text-5xl md:text-7xl font-extrabold tracking-tight text-white mb-4">
            Own AI
          </h1>
</div>
</div>
<!-- Welcome Message -->
<div class="space-y-6">
<h2 class="font-headline text-3xl md:text-5xl font-bold tracking-tight text-white leading-tight">
          Welcome to Own AI, Denis!
        </h2>
<p class="text-lg md:text-xl text-white/80 font-body leading-relaxed max-w-md mx-auto">
          You have <span class="text-white font-semibold">€2.00</span> in free credits. Let's get you set up in 30 seconds.
        </p>
</div>
<!-- Free Credit Badge -->
<div class="mt-8 flex items-center justify-center">
<div class="glass-effect px-4 py-2 rounded-xl border border-white/5 flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary text-sm">auto_awesome</span>
<span class="font-mono text-xs text-on-surface-variant tracking-wider uppercase">Promotional Balance Active</span>
</div>
</div>

<!-- Shine Effect -->
<div class="absolute top-0 -left-full w-full h-full bg-gradient-to-r from-transparent via-white/20 to-transparent group-hover:left-full transition-all duration-700 ease-in-out"></div>
<span>Next</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1">arrow_forward</span>
</button>
</div>
<!-- Decorative Elements (Asymmetric) -->
<div class="absolute -top-24 -left-24 w-96 h-96 bg-indigo-500/10 blur-[120px] rounded-full"></div>
<div class="absolute -bottom-24 -right-24 w-96 h-96 bg-fuchsia-500/10 blur-[120px] rounded-full"></div>

<aside aria-hidden="true" class="hidden">
<!-- 
      Shared Component Structure: 
      tab_labels: ["Welcome", "Model Selection", "Instructions", "Finalize"]
      tab_icons: ["rocket_launch", "Psychology", "edit_note", "auto_awesome"]
    -->
